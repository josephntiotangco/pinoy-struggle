<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171613">
  <meta name="description" content="Play Arena or Survival as Juan, or browse monsters and maps in the Pinoy Struggle Dex.">
  <title>Pinoy Struggle · Select Mode</title>
  <link rel="stylesheet" href="mode-select.css">
</head>
<body class="mode-home">
  <!-- JT-2026/11/23 - make mode selection the homepage and keep the arcade in arena.html -->
  <main class="mode-shell">
    <div class="mode-brand">
      <span class="mode-mark" aria-hidden="true">PS</span>
      <span>Pinoy <strong>Struggle</strong></span>
    </div>
    <h1 id="mode-heading">Select <strong>Mode</strong></h1>
    <nav class="mode-grid" aria-labelledby="mode-heading">
      <a class="mode-card arena-card" href="./arena.html">
        <img src="assets/arcade/previews/malacaniang_0.jpg" width="480" height="270" alt="">
        <div class="mode-card-copy">
          <h2>Arena</h2>
          <p>Face one challenger at a time across 18 stages.</p>
          <span class="mode-action">Play Arena</span>
        </div>
      </a>
      <a class="mode-card survival-card" href="./survival.html">
        <img src="assets/arcade/previews/edsa_0.jpg" width="480" height="270" alt="">
        <div class="mode-card-copy">
          <h2>Survival</h2>
          <p>Survive 12 waves across Tondo, EDSA, Bahay, and G. Araneta.</p>
          <span class="mode-action">Play Survival</span>
        </div>
      </a>
      <!-- JT-2026/11/23 - open the monster and map guide from mode select -->
      <a class="mode-card dex-card" href="./dex.html">
        <img src="assets/arcade/previews/g_araneta_0.jpg" width="480" height="270" alt="">
        <div class="mode-card-copy">
          <h2>Dex</h2>
          <p>Explore the monsters and maps of Pinoy Struggle.</p>
        </div>
        <span class="mode-action">Open Dex</span>
      </a>
    </nav>
  </main>
</body>
</html>
